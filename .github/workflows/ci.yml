name: CI

on:
  pull_request:
  push:
    branches: [main]

env:
  # Cargo.toml의 `wasm-bindgen = "=0.2.128"`과 정확히 맞춰야 한다
  # (repo-layout.md "알려진 함정" — CLI/크레이트 버전 불일치 시 런타임 에러).
  WASM_BINDGEN_CLI_VERSION: "0.2.128"

jobs:
  rust:
    name: Rust (fmt · clippy · test · 의존성 검증)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 툴체인 확인 (rust-toolchain.toml 자동 인식)
        run: rustup show

      - name: Cargo 캐시
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: cargo-${{ runner.os }}-

      - name: cargo fmt --check
        run: cargo fmt --all -- --check

      - name: cargo clippy (경고 = 에러)
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: cargo test --workspace
        run: cargo test --workspace

      # H4(tests/no_leak.rs)·CB-6 전용 재확인(tests/netsim.rs)은 M2 host.rs/
      # client.rs와 함께 추가된다 (호스트 권위·시야가 001에 없다 —
      # tech-debt-tracker TD-012). tests/determinism.rs는 이미 위 스텝의
      # `cargo test --workspace`에 포함돼 실행된다.

      - name: sim 의존성 0 확인 (DD-006)
        run: |
          DEPS=$(cargo tree -p peekaboom-sim -e normal --prefix none | tail -n +2)
          if [ -n "$DEPS" ]; then
            echo "peekaboom-sim에 의존성이 생겼습니다 (sim은 의존성 0이어야 함):" >&2
            echo "$DEPS" >&2
            exit 1
          fi

  wasm-and-web:
    name: WASM 빌드 · 번들 · E2E
    runs-on: ubuntu-latest
    needs: rust
    steps:
      - uses: actions/checkout@v4

      - name: 툴체인 확인 (rust-toolchain.toml 자동 인식)
        run: rustup show

      - name: Cargo 캐시
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-wasm-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: cargo-wasm-${{ runner.os }}-

      - name: wasm-bindgen-cli 설치 (버전 고정)
        run: |
          if ! command -v wasm-bindgen >/dev/null || \
             [ "$(wasm-bindgen --version | awk '{print $2}')" != "$WASM_BINDGEN_CLI_VERSION" ]; then
            cargo install wasm-bindgen-cli --version "$WASM_BINDGEN_CLI_VERSION" --locked
          fi

      - name: wasm 빌드
        run: cargo build --release --target wasm32-unknown-unknown -p peekaboom-app

      - name: wasm-bindgen
        run: |
          mkdir -p pkg
          wasm-bindgen target/wasm32-unknown-unknown/release/peekaboom_app.wasm \
            --out-dir pkg --target web

      - name: 번들 크기 확인 (H5)
        run: bash tools/check_size.sh pkg/peekaboom_app_bg.wasm

      - name: 에셋 참조 확인 (H7)
        run: bash tools/check_assets.sh

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: npm run build
        run: npm run build

      - name: Playwright 브라우저 설치
        run: npx playwright install --with-deps chromium

      - name: Playwright E2E (2피어)
        run: npx playwright test
