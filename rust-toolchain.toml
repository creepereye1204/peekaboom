[toolchain]
# wasm-bindgen-cli 0.2.128(Cargo.toml에 정확히 핀 고정)이 스스로 밝히는
# MSRV는 1.86이지만, 그 전이 의존성(icu_*, time)이 실제로는 1.88을 요구해서
# 1.86에서도 `cargo install`이 터졌다 (실측: GitHub Actions — tech-debt-tracker
# "해결된 부채" 참조). 여유를 두고 1.95로 고정한다.
channel = "1.95"
targets = ["wasm32-unknown-unknown"]
components = ["rustfmt", "clippy"]
