[package]
name = "peekaboom-render"
version = "0.1.0"
edition = "2021"

[lib]
name = "peekaboom_render"

[dependencies]
peekaboom-sim = { path = "../sim" }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "=0.2.128"
js-sys = "0.3"
web-sys = { version = "0.3", features = [
    "HtmlCanvasElement",
    "WebGl2RenderingContext",
    "WebGlBuffer",
    "WebGlProgram",
    "WebGlShader",
    "WebGlUniformLocation",
    "WebGlVertexArrayObject",
] }
