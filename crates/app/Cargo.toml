[package]
name = "peekaboom-app"
version = "0.1.0"
edition = "2021"

[lib]
name = "peekaboom_app"
crate-type = ["cdylib", "rlib"]

[dependencies]
peekaboom-sim = { path = "../sim" }
peekaboom-input = { path = "../input" }
peekaboom-render = { path = "../render" }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "=0.2.128"
web-sys = { version = "0.3", features = ["HtmlCanvasElement"] }
